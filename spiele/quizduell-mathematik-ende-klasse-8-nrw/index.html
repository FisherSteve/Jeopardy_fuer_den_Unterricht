<title>Quizduell Olymp – Schulmodus</title>
<style>

}
*{box-sizing:border-box}

#app{min-height:100vh;background:
  radial-gradient(circle at 50% 10%,rgba(58,101,255,.28),transparent 32%),
  radial-gradient(circle at 10% 80%,rgba(68,35,170,.25),transparent 30%),

.iconbtn:hover{background:rgba(24,62,136,.75);border-color:rgba(163,203,255,.48)}

.setup-grid{display:grid;gap:16px}

.note{font-size:13px;color:#91a7d7;line-height:1.45}

.side.right .side-badge{background:linear-gradient(180deg,rgba(81,55,154,.7),rgba(25,20,70,.85));border-color:rgba(194,171,255,.25)}
.side-name{font-size:clamp(14px,1.5vw,21px);font-weight:850;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side-sub{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:#91a8da;margin-top:2px}

.roundmark .big{font-weight:900;font-size:20px}.roundmark .small{font-size:11px;letter-spacing:.14em;color:#91a8d7;text-transform:uppercase;margin-top:4px}
.category-wrap{text-align:center}
.eyebrow{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:#91aae2;font-weight:850;margin-bottom:8px}
.screen-title{font-size:clamp(32px,4.7vw,72px);letter-spacing:-.045em;margin:0 0 10px;font-weight:950}
.screen-sub{color:#aebdde;font-size:clamp(15px,1.6vw,22px);margin:0 auto 28px;max-width:830px;line-height:1.4}
.category-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:24px}
.cat{min-height:230px;border:none;border-radius:28px;position:relative;overflow:hidden;color:white;text-align:left;padding:24px;cursor:pointer;background:
  radial-gradient(circle at 80% 15%,rgba(122,176,255,.28),transparent 32%),
  linear-gradient(155deg,rgba(27,75,174,.96),rgba(8,28,71,.96));border:1px solid rgba(171,207,255,.28);box-shadow:inset 0 1px rgba(255,255,255,.08),0 18px 45px rgba(0,0,0,.2);transition:.2s;background-size:cover;background-position:center}
.cat::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(2,10,30,.83),rgba(5,19,53,.18));z-index:0}
.cat:hover{transform:translateY(-5px) scale(1.008);border-color:#82b8ff;box-shadow:0 24px 60px rgba(0,0,0,.3),0 0 35px rgba(65,125,255,.1)}
.cat > *{position:relative;z-index:1}
.cat-index{font-size:12px;font-weight:900;letter-spacing:.18em;color:#91c4ff;text-transform:uppercase}
.cat-name{position:absolute;left:24px;bottom:24px;right:24px;font-size:clamp(25px,2.8vw,43px);font-weight:950;letter-spacing:-.04em;line-height:.95}
.question-stage{max-width:1220px;margin:auto}
.qhead{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:14px}
.category-pill{display:inline-flex;align-items:center;gap:9px;padding:10px 14px;border:1px solid rgba(170,205,255,.27);border-radius:999px;background:rgba(10,36,90,.72);font-weight:850;font-size:14px}
.dot{width:9px;height:9px;border-radius:50%;background:#69acff;box-shadow:0 0 14px #4e9cff}
.phase-pill{padding:9px 13px;border-radius:999px;background:rgba(10,23,56,.65);border:1px solid rgba(174,204,255,.2);color:#a8bde7;font-weight:800;font-size:12px;text-transform:uppercase;letter-spacing:.12em}
.question-card{position:relative;min-height:195px;display:grid;place-items:center;text-align:center;padding:32px 50px;margin-bottom:16px;background:
  radial-gradient(circle at 50% 0,rgba(71,128,255,.15),transparent 48%),
  linear-gradient(180deg,rgba(15,46,108,.94),rgba(4,20,53,.95));border:1px solid rgba(180,213,255,.28);border-radius:26px;box-shadow:inset 0 1px rgba(255,255,255,.07),0 22px 60px rgba(0,0,0,.2);overflow:hidden}
.question-card::before,.question-card::after{content:"";position:absolute;top:50%;width:80px;height:3px;background:linear-gradient(90deg,transparent,#69aaff)}
.question-card::before{left:0}.question-card::after{right:0;transform:scaleX(-1)}
.question-text{font-size:clamp(24px,3.1vw,47px);font-weight:850;letter-spacing:-.035em;line-height:1.14;max-width:1080px}
.question-img{max-height:210px;max-width:min(100%,600px);border-radius:16px;margin-top:18px;border:1px solid rgba(187,214,255,.24)}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:13px}
.answer{min-height:86px;border-radius:18px;border:1px solid rgba(161,198,255,.23);background:linear-gradient(180deg,rgba(25,67,147,.88),rgba(8,29,74,.92));display:grid;grid-template-columns:54px 1fr;align-items:center;gap:8px;text-align:left;padding:10px 18px 10px 10px;cursor:pointer;transition:.14s;box-shadow:inset 0 1px rgba(255,255,255,.05)}
.answer:hover:not(:disabled){filter:brightness(1.11);border-color:#74b4ff;transform:translateY(-1px)}
.answer .letter{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:rgba(0,8,30,.38);border:1px solid rgba(188,218,255,.24);font-weight:950;color:#a9ccff;font-size:18px}
.answer .txt{font-size:clamp(16px,1.55vw,22px);font-weight:780;line-height:1.2}
.answer.selected{border-color:#c0ddff;background:linear-gradient(180deg,#367cea,#174aaf);box-shadow:0 0 0 2px rgba(117,181,255,.24),0 0 30px rgba(54,126,255,.13)}
.answer.correct{background:linear-gradient(180deg,#32b977,#167649);border-color:#72eeb2;box-shadow:0 0 30px rgba(42,210,132,.16)}
.answer.wrong{background:linear-gradient(180deg,#c2475e,#7e273b);border-color:#ff8192}
.answer.dim{opacity:.43}
.answer:disabled{cursor:default}
.answer.correct .letter,.answer.wrong .letter{color:white}
.status-card{margin-top:14px;border-radius:18px;border:1px solid rgba(166,201,255,.2);background:rgba(4,17,46,.75);padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:14px;min-height:67px}
.status-main{font-weight:850;font-size:16px}.status-sub{color:#8fa7d6;font-size:12px;margin-top:3px}
.secret{display:flex;gap:8px;align-items:center}.lock-dot{width:10px;height:10px;border-radius:50%;background:#f2ad38;box-shadow:0 0 14px rgba(242,173,56,.55);animation:pulse 1.2s infinite}@keyframes pulse{50%{opacity:.4}}
.reveal-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.reveal-card{border:1px solid rgba(175,207,255,.19);border-radius:17px;background:rgba(5,20,53,.72);padding:14px}.reveal-card.righty{border-color:rgba(205,181,255,.2)}
.reveal-label{font-size:11px;text-transform:uppercase;letter-spacing:.14em;color:#8ea8dd;font-weight:850}.reveal-answer{font-weight:900;font-size:18px;margin-top:4px}
.round-summary{max-width:1000px;margin:auto;text-align:center}.duel-score{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:25px;margin:30px auto;max-width:800px}.duel-num{font-size:clamp(80px,12vw,170px);font-weight:950;line-height:.8;letter-spacing:-.07em}.duel-num.olymp{color:#c0a8ff}.duel-vs{font-size:18px;color:#8099cd;font-weight:900}.mini-label{text-transform:uppercase;letter-spacing:.16em;font-size:11px;color:#91a7d5;font-weight:850;margin-top:12px}
.progress{display:flex;justify-content:center;gap:7px;margin:22px 0}.prog-dot{width:48px;height:8px;border-radius:99px;background:rgba(130,163,221,.17);border:1px solid rgba(160,192,246,.13)}.prog-dot.done{background:#3980f0}.prog-dot.current{background:#f0a52f;box-shadow:0 0 14px rgba(240,165,47,.28)}
.final-intro{max-width:1050px;margin:auto;text-align:center}.final-pairs{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:28px auto;max-width:820px}.final-side{background:linear-gradient(180deg,rgba(20,55,126,.82),rgba(6,24,62,.85));border:1px solid rgba(177,211,255,.24);border-radius:24px;padding:23px}.final-side.ol{background:linear-gradient(180deg,rgba(74,50,144,.8),rgba(25,18,69,.88));border-color:rgba(207,188,255,.25)}.final-qcount{font-size:64px;font-weight:950;line-height:1}.final-qcount span{font-size:14px;color:#9aadd4;letter-spacing:.1em;text-transform:uppercase;margin-left:7px}
.final-game{max-width:1100px;margin:auto}.timer-ring{width:118px;height:118px;border-radius:50%;margin:0 auto 18px;display:grid;place-items:center;position:relative;background:conic-gradient(#f4ad37 calc(var(--t,1)*360deg),rgba(116,146,204,.17) 0);box-shadow:0 0 35px rgba(237,159,43,.13)}.timer-ring::after{content:"";position:absolute;inset:8px;border-radius:50%;background:#071637;border:1px solid rgba(188,214,255,.19)}.timer-num{position:relative;z-index:2;font-size:48px;font-weight:950}.final-question{font-size:clamp(28px,4vw,58px);font-weight:900;letter-spacing:-.045em;line-height:1.1;text-align:center;min-height:160px;display:grid;place-items:center;padding:25px;background:linear-gradient(180deg,rgba(17,49,112,.85),rgba(5,21,55,.9));border:1px solid rgba(180,211,255,.24);border-radius:25px}.judge{display:flex;justify-content:center;gap:14px;margin-top:18px}.judge .btn{min-width:170px;font-size:18px}.btn.good{background:linear-gradient(180deg,#39bb7b,#17734a);border-color:#7beeb9}.btn.bad{background:linear-gradient(180deg,#cc4c62,#822a3d);border-color:#ff8898}
.final-stats{display:flex;justify-content:center;gap:14px;margin:16px 0}.stat{min-width:150px;border-radius:16px;background:rgba(4,17,46,.72);border:1px solid rgba(170,204,255,.18);padding:11px 14px;text-align:center}.stat b{font-size:24px;display:block}.stat span{font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:#93a9d6}
.winner{max-width:980px;margin:auto;text-align:center}.winner-big{font-size:clamp(54px,9vw,130px);font-weight:950;letter-spacing:-.07em;line-height:.86;margin:14px 0 20px}.winner-big em{font-style:normal;color:#ffc05a}.confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden}.confetti i{position:absolute;top:-30px;width:10px;height:24px;border-radius:3px;animation:fall var(--d) linear infinite;animation-delay:var(--delay);background:var(--c);opacity:.8}@keyframes fall{to{transform:translate3d(var(--x),110vh,0) rotate(620deg)}}
.shortcuts{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:8;display:flex;gap:8px;align-items:center;padding:8px 10px;border-radius:14px;background:rgba(2,10,28,.83);border:1px solid rgba(166,197,244,.16);backdrop-filter:blur(12px);font-size:11px;color:#9eb0d6;transition:.2s;white-space:nowrap}.shortcuts.hidden{opacity:0;pointer-events:none;transform:translate(-50%,12px)}kbd{border:1px solid rgba(173,204,255,.26);background:rgba(44,73,128,.45);border-radius:6px;padding:3px 6px;color:#e7efff;font-weight:850;box-shadow:inset 0 -1px rgba(0,0,0,.2)}
dialog{width:min(980px,94vw);max-height:86vh;color:white;background:linear-gradient(180deg,#0c285d,#061634);border:1px solid rgba(184,214,255,.26);border-radius:24px;padding:0;box-shadow:0 40px 100px rgba(0,0,0,.5)}dialog::backdrop{background:rgba(0,3,12,.78);backdrop-filter:blur(4px)}.dialog-head{display:flex;justify-content:space-between;align-items:center;padding:20px 22px;border-bottom:1px solid rgba(173,204,255,.15)}.dialog-body{padding:20px 22px}.dialog-body textarea{width:100%;min-height:46vh;resize:vertical;background:#020b1c;color:#dce8ff;border:1px solid rgba(173,204,255,.18);border-radius:14px;padding:14px;font:13px/1.45 ui-monospace,SFMono-Regular,Consolas,monospace}.dialog-foot{display:flex;justify-content:flex-end;gap:10px;padding:0 22px 22px}.closex{border:0;background:transparent;color:#b8c7e6;font-size:24px;cursor:pointer}.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-18px);z-index:20;padding:11px 15px;border-radius:12px;background:#102d68;border:1px solid rgba(178,210,255,.24);box-shadow:0 18px 50px rgba(0,0,0,.35);font-weight:800;font-size:13px;opacity:0;pointer-events:none;transition:.22s}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-width:850px){.shell{padding:16px 14px 82px}.hero{grid-template-columns:1fr;min-height:auto}.hero-title{font-size:64px}.category-grid{grid-template-columns:1fr}.cat{min-height:150px}.answers{grid-template-columns:1fr}.scorebar{gap:7px}.side{gap:6px}.score{width:52px;height:52px;border-radius:15px;font-size:24px}.side-badge{padding:8px 10px}.roundmark{min-width:92px}.roundmark .big{font-size:15px}.roundmark .small{display:none}.question-card{padding:24px 22px}.reveal-grid{grid-template-columns:1fr}.final-pairs{grid-template-columns:1fr}.shortcuts{max-width:94vw;overflow:auto}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition:none!important}}

/* Classroom input, long text, native mathematics and keyboard focus. */
button{min-width:52px;min-height:52px;touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:3px solid #fff;outline-offset:4px}
#screen:focus{outline:none}
.iconbtn{width:52px;height:52px}
.side,.side-badge,.panel,.question-stage,.field,.hero>div{min-width:0}
.side-name{white-space:normal;overflow-wrap:anywhere}
.question-text,.final-question,.cat-name,.txt,.reveal-answer,.hero-copy,.status-main,.winner-big{overflow-wrap:anywhere;white-space:pre-wrap}
.status-card,.qhead,.topbar{flex-wrap:wrap}
.status-card .btn{flex-shrink:0}
.learning-feedback{padding:24px;border:2px solid #69b7ff;border-radius:18px;background:#071e49;margin-top:20px;font-size:clamp(20px,2vw,28px);line-height:1.5}
.learning-feedback h2{font-size:clamp(24px,2.6vw,36px);margin-top:0}
.learning-feedback.is-correct{border-color:#35d58a;animation:success-glow .7s ease-out}
@keyframes success-glow{50%{box-shadow:0 0 40px #35d58a88}}
@media(prefers-reduced-motion:reduce){.learning-feedback.is-correct{animation:none}}
.phase-pill{font-size:clamp(18px,2vw,26px);background:#f0a128;color:#08162e;font-weight:900}
.math-block{margin:24px 0;font-family:"Cambria Math","STIX Two Math",serif;font-size:clamp(30px,4.5vw,64px);overflow-x:auto;padding:8px 4px}
.math-block math{margin:auto;max-width:100%;font-weight:400}
.learning-feedback .math-block{font-size:clamp(28px,3vw,42px)}
.final-question{font-size:clamp(28px,4vw,58px)}
.question-text{font-size:clamp(26px,3.2vw,48px)}
.question-card::before,.question-card::after{display:none}
[hidden]{display:none!important}
@media(max-width:600px){
 .hero-title{font-size:clamp(42px,12vw,64px)}
 .brand{flex-wrap:wrap}.brand-main{font-size:32px}
 .scorebar{grid-template-columns:1fr 1fr}.roundmark{grid-column:1/-1;grid-row:2}
 .side{align-items:flex-start}.side-badge{padding:8px 4px}
 .hero,.panel{padding:16px}.field input{width:100%}
 .judge,.btnrow{flex-wrap:wrap}.btn{white-space:normal;max-width:100%}
 .status-card{align-items:stretch}.status-card .btn{width:100%}
 .final-stats{gap:12px}.stat{min-width:0;overflow-wrap:anywhere}
 .winner-big{font-size:clamp(36px,10vw,64px)}
 .shortcuts{position:static;transform:none;margin:12px auto;white-space:normal;flex-wrap:wrap}
 .shortcuts.hidden{display:none}
}
</style>
</head>
<body>
<div id="app">
  <div class="floaters" id="floaters" aria-hidden="true"></div>
  <div class="shell">
    <div class="topbar">
      <div>
        <div class="brand"><div class="brand-main">Quizduell</div><div class="brand-olymp">Olymp</div></div>
        <div class="micro">Schulmodus · Lehrer gegen Klasse</div>

<script>/* Random display order; original indices remain the scoring contract. */
(function(root){
  'use strict';
  function shuffle(items,random=Math.random){
    const out=items.slice();
    for(let i=out.length-1;i>0;i--){const j=Math.floor(random()*(i+1));[out[i],out[j]]=[out[j],out[i]];}
    return out;
  }
  function prepare(questions,random=Math.random){
    const orders=new Map(),groups=new Map();
    for(const q of questions){
      const r=q.response;if(!r||r.type!=='choice')continue;
      if(r.correct.length!==1){orders.set(q.id,shuffle(r.options.map((_,i)=>i),random));continue;}
      const n=r.options.length;if(!groups.has(n))groups.set(n,[]);groups.get(n).push(q);
    }
    for(const [n,group] of groups){
      // Randomized balanced positions: no fixed ABCD cycle or dominant letter.
      const offset=shuffle(Array.from({length:n},(_,i)=>i),random);
      const targets=shuffle(group.map((_,i)=>offset[i%n]),random);
      group.forEach((q,i)=>{
        const correct=q.response.correct[0];
        const order=shuffle(q.response.options.map((_,j)=>j).filter(j=>j!==correct),random);
        order.splice(targets[i],0,correct);orders.set(q.id,order);
      });
    }

  }

(function(root){

  function validate(m){

      valid=Array.isArray(m.rows)&&m.rows.length>=1&&m.rows.length<=4&&Array.isArray(m.rows[0])&&m.rows[0].length>=1&&m.rows[0].length<=4&&m.rows.every(r=>Array.isArray(r)&&r.length===m.rows[0].length&&r.every(text));

  }
  const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

(function(root){
  'use strict';

  function validate(d){
    const errors=[];
    const str=(v,p,max)=>{if(typeof v!=='string'||!v.trim()||v.length>max)errors.push(p+': Text erforderlich (max. '+max+' Zeichen).');};
    if(!d||typeof d!=='object')throw new Error('Spieldaten fehlen.');
    if(d.schemaVersion!==1||d.gameType!=='quizduell')errors.push('schemaVersion: 1 und gameType: "quizduell" erforderlich.');
    str(d.id,'id',80);str(d.title,'title',100);
    if(typeof d.id!=='string'||!/^[a-z0-9-]+$/.test(d.id))errors.push('id: nur a–z, 0–9 und Bindestriche.');
    if(!Array.isArray(d.teams)||d.teams.length!==2)errors.push('Genau zwei Namen: Herausforderer und Olymp.');

      if(q.level!==undefined)str(q.level,p+'.level',80);
      if(choice){
        const r=q.response;
        if(!r||r.type!=='choice'||!Array.isArray(r.options)||r.options.length!==4||!r.options.every(v=>typeof v==='string'&&v.trim()&&v.length<=300)||new Set(r.options.map(v=>typeof v==='string'?v.trim():v)).size!==4)errors.push(p+': Vier unterschiedliche Textoptionen erforderlich.');
        if(!r||!Array.isArray(r.correct)||r.correct.length!==1||!Number.isInteger(r.correct[0])||r.correct[0]<0||r.correct[0]>3)errors.push(p+': correct enthält genau einen Index von 0 bis 3.');
        if(r&&Array.isArray(r.options)&&Array.isArray(r.correct)&&q.answer!==r.options[r.correct[0]])errors.push(p+': answer muss exakt der richtigen Option entsprechen.');
      }
      for(const key of ['questionMath','answerMath'])if(q[key]!==undefined){try{math.validate(q[key]);}catch(e){errors.push(p+'.'+key+': '+e.message);}}
      const allowed=['id','question','answer','explanation','level','questionMath','answerMath',...(choice?['response']:[])];
      if(Object.keys(q).some(k=>!allowed.includes(k)))errors.push(p+': Nicht unterstütztes Aufgabenfeld. Erlaubt: '+allowed.join(', '));
    }
    // Eight categories preserve three choices even in round six.
    if(!Array.isArray(d.categories)||d.categories.length<8||d.categories.length>20)errors.push('Quizduell braucht 8 bis 20 Kategorien mit je 3 Fragen.');
    (Array.isArray(d.categories)?d.categories:[]).forEach((c,i)=>{
      if(!c||typeof c!=='object'){errors.push('Kategorie fehlt.');return;}
      str(c.title,'Kategorie '+i,90);
      if(Object.keys(c).some(k=>!['title','questions'].includes(k)))errors.push('Kategorie '+i+': Nur title und questions unterstützt.');
      if(!Array.isArray(c.questions)||c.questions.length!==3)errors.push('Kategorie '+i+': genau 3 Fragen erforderlich.');
      (Array.isArray(c.questions)?c.questions:[]).forEach((q,j)=>question(q,i+'/'+j,true));

    (Array.isArray(d.finalQuestions)?d.finalQuestions:[]).forEach((q,i)=>question(q,'Finale '+i,false));
    if(Object.keys(d).some(k=>!['schemaVersion','gameType','id','title','teams','categories','finalQuestions'].includes(k)))errors.push('Nicht unterstütztes Quizduell-Feld. Keine Jeopardy-Punkte-/Timerregeln verwenden.');

  }

function olympSecret(i){if(state.view!=='question'||state.phase!=='olymp'||!Number.isInteger(i)||i<0||i>3)return;if($('#secretDialog').open)$('#secretDialog').close();state.olympAnswer=i;tone(330,.07);state.phase='team';render();toast('Olymp-Antwort ist eingeloggt.');}
function selectTeam(i){if(state.view!=='question'||state.phase!=='team'||!Number.isInteger(i)||i<0||i>3)return;state.teamAnswer=i;tone(430,.05);document.querySelectorAll('.answer').forEach((b,j)=>{b.classList.toggle('selected',j===i);b.setAttribute('aria-pressed',String(j===i));});$('#lockTeam').disabled=false;}
function lockTeam(){if(state.phase!=='team'||state.teamAnswer===null)return;const q=currentQ();state.phase='reveal';state.teamScore+=E.score(q.correct,state.teamAnswer);state.olympScore+=E.score(q.correct,state.olympAnswer);state.history.push({round:state.round,category:bank[state.category].name,q:state.qIndex,team:state.teamAnswer,olymp:state.olympAnswer,correct:q.correct});chime(state.teamAnswer===q.correct);state.continueAfter=performance.now()+450;render()}
function nextQuestion(){if(state.view!=='question'||state.phase!=='reveal'||performance.now()<state.continueAfter)return;if(state.qIndex<2){state.qIndex++;state.phase='olymp';state.olympAnswer=null;state.teamAnswer=null;render()}else{state.view='roundEnd';render()}}
function renderRoundEnd(){const rt=state.teamScore-state.roundTeamStart,ro=state.olympScore-state.roundOlympStart;let line=rt>ro?`${state.teamName} gewinnt diese Runde.`:ro>rt?`${state.olympName} gewinnt diese Runde.`:'Diese Runde endet unentschieden.';screen.innerHTML=`${scoreHeader()}<section class="round-summary"><div class="eyebrow">${esc(bank[state.category].name)} · drei Fragen gespielt</div><h2 class="screen-title">${esc(line)}</h2><div class="duel-score"><div><div class="duel-num">${rt}</div><div class="mini-label">${esc(state.teamName)}</div></div><div class="duel-vs">:</div><div><div class="duel-num olymp">${ro}</div><div class="mini-label">${esc(state.olympName)}</div></div></div><p class="screen-sub">Gesamtstand: ${state.teamScore} : ${state.olympScore}</p><button class="btn orange" id="continueRound">${state.round<5?'Nächste Runde':'Zum Finale'}</button><div class="progress">${[0,1,2,3,4,5].map(i=>`<i class="prog-dot ${i<=state.round?'done':''}"></i>`).join('')}</div></section>`;$('#continueRound').addEventListener('click',()=>{tone(510,.07);if(state.round<5){state.round++;offerCategories()}else{prepareFinal()}})}
function prepareFinal(){const first=state.teamScore<=state.olympScore?'team':'olymp';state.final={first,order:first==='team'?['team','olymp']:['olymp','team'],turnIndex:0,qIndex:0,correct:{team:0,olymp:0},questions:{team:state.teamScore,olymp:state.olympScore},bank:shuffle(FINAL_BANK),bankPos:0,question:null,stage:'intro',time:5,timedOut:false};state.view='finalIntro';render()}
function renderFinalIntro(){const f=state.final;screen.innerHTML=`<section class="final-intro"><div class="eyebrow">Das Finale</div><h2 class="screen-title">Jeder Punkt wird zur Finalfrage.</h2><p class="screen-sub">${f.first==='team'?esc(state.teamName):esc(state.olympName)} beginnt mit der niedrigeren bzw. gleichen Anzahl an Fragen. Die Zeit gilt für beide Seiten und lässt sich hier vor dem Start einstellen.</p><div class="final-pairs"><div class="final-side"><div class="mini-label">${esc(state.teamName)}</div><div class="final-qcount">${f.questions.team}<span>Fragen</span></div></div><div class="final-side ol"><div class="mini-label">${esc(state.olympName)}</div><div class="final-qcount">${f.questions.olymp}<span>Fragen</span></div></div></div>${timerSetting()}<button class="btn orange" id="startFinal">Finale starten</button></section>`;wireFinalSeconds();$('#startFinal').addEventListener('click',()=>{if(!readFinalSeconds())return;f.stage='ready';state.view='finalGame';render()})}
function activeSide(){return state.final.order[state.final.turnIndex]}
function sideName(side){return side==='team'?state.teamName:state.olympName}
function finalQuestionText(item){return item&&typeof item==='object'?item.q:String(item||'')}
function finalAnswerText(item){return item&&typeof item==='object'&&item.answer?item.answer:''}
function finalLevelText(item){return item&&typeof item==='object'&&item.level?item.level:''}
function renderFinalGame(){const f=state.final,side=activeSide(),max=f.questions[side];if(max===0){finishSide();return}const used=f.qIndex;const ready=f.stage==='ready',asking=f.stage==='asking',judging=f.stage==='judging';const fq=finalQuestionText(f.question),fa=finalAnswerText(f.question),fl=finalLevelText(f.question);screen.innerHTML=`<section class="final-game"><div class="eyebrow" style="text-align:center">Finale · ${esc(sideName(side))} · Frage ${Math.min(used+1,max)} von ${max}${fl?' · '+esc(fl):''}</div><div class="final-stats"><div class="stat"><b>${f.correct.team}</b><span>${esc(state.teamName)} richtig</span></div><div class="stat"><b>${f.correct.olymp}</b><span>${esc(state.olympName)} richtig</span></div></div>${asking||judging?`<div class="timer-ring" id="timerRing" style="--t:${Math.max(0,f.time)/finalSeconds}"><div class="timer-num" id="timerNum">${Math.ceil(Math.max(0,f.time))}</div></div>`:''}<div class="final-question">${ready?'Bereit für die nächste Finalfrage?':esc(fq)}</div>${!ready?window.GameMath.markup(f.question.questionMath):''}${judging&&fa?`<div class="status-card" style="margin-top:18px"><div><div class="status-main">Lösung: ${esc(fa)}</div><div class="status-sub">${esc(f.question.explanation)}</div>${window.GameMath.markup(f.question.answerMath)}</div></div>`:''}${ready?`<div class="judge"><button class="btn orange" id="goFinal">Frage starten</button></div>`:''}${asking?`<div class="status-card" style="margin-top:18px"><div><div class="status-main" id="timerStatus">${finalSeconds} Sekunden laufen …</div><div class="status-sub">Antwort laut geben. Danach bewertet die Spielleitung.</div></div><button class="btn primary" id="stopFinal">Antwort gegeben · aufdecken</button></div>`:''}${judging?`<div class="judge"><button class="btn good" id="judgeRight">Richtig</button><button class="btn bad" id="judgeWrong">Falsch</button></div>`:''}</section>`;
 if(asking)$('#stopFinal').addEventListener('click',revealFinal);if(ready)$('#goFinal').addEventListener('click',startFinalQuestion);if(judging){$('#judgeRight').addEventListener('click',()=>judgeFinal(true));$('#judgeWrong').addEventListener('click',()=>judgeFinal(false))}}
function revealFinal(){if(state.view!=='finalGame'||state.final.stage!=='asking')return;stopTimer();state.final.stage='judging';state.continueAfter=performance.now()+450;render()}
function tickFinal(){const f=state.final;if(!f||f.stage!=='asking'||document.hidden)return;
 f.time=Math.max(0,(finalTickStart-performance.now())/1000);
 const n=$('#timerNum'),r=$('#timerRing');if(n)n.textContent=Math.ceil(f.time);if(r)r.style.setProperty('--t',f.time/finalSeconds);
 if(f.time<=0){f.timedOut=true;revealFinal();tone(145,.22,'square',.03);}
}
function startFinalQuestion(){const f=state.final;if(state.view!=='finalGame'||f.stage!=='ready')return;
 f.question=f.bank[f.bankPos++];f.stage='asking';f.time=finalSeconds;f.timedOut=false;render();finalTickStart=performance.now()+finalSeconds*1000;finalTimer=setInterval(tickFinal,70);
}
document.addEventListener('visibilitychange',()=>{if(state.view!=='finalGame'||state.final.stage!=='asking')return;
 if(document.hidden){state.final.time=Math.max(0,(finalTickStart-performance.now())/1000);stopTimer();}
 else{finalTickStart=performance.now()+state.final.time*1000;tickFinal();if(state.final.stage==='asking')finalTimer=setInterval(tickFinal,70);}
});
function judgeFinal(ok){if(state.view!=='finalGame'||state.final.stage!=='judging'||performance.now()<state.continueAfter)return;stopTimer();const f=state.final,side=activeSide();if(ok){f.correct[side]++;chime(true)}else chime(false);f.qIndex++;
 if(f.turnIndex===1){const first=f.order[0],second=f.order[1],firstScore=f.correct[first],secondScore=f.correct[second],remaining=f.questions[second]-f.qIndex;const outcome=E.finalOutcome(firstScore,secondScore,remaining);if(outcome==='second'){finishGame(second);return}if(outcome==='first'){finishGame(first);return}}
 if(f.qIndex>=f.questions[side]){finishSide();return}f.stage='ready';f.question=null;render()}
function finishSide(){const f=state.final;if(f.turnIndex===0){f.turnIndex=1;f.qIndex=0;f.stage='ready';f.question=null;render();toast(`${sideName(activeSide())} ist jetzt dran.`);return}const a=f.correct.team,b=f.correct.olymp;if(a===b){state.view='tiebreak';state.tieQuestion=f.bank[f.bankPos++];state.tieRevealed=false;render()}else finishGame(a>b?'team':'olymp')}
function renderTiebreak(){const q=state.tieQuestion;screen.innerHTML=`<section class="final-game"><div class="eyebrow">Gleichstand · Stichfrage</div><h2 class="screen-title">Eine Frage entscheidet.</h2><div class="final-question">${esc(q.q)}</div>${window.GameMath.markup(q.questionMath)}
 ${state.tieRevealed?`<div class="learning-feedback"><strong>Lösung: ${esc(q.answer)}</strong>${window.GameMath.markup(q.answerMath)}<p>${esc(q.explanation)}</p></div><p>Die Spielleitung entscheidet, wer zuerst korrekt geantwortet hat.</p><div class="judge"><button class="btn primary" id="teamTie">${esc(state.teamName)} gewinnt</button><button class="btn orange" id="olympTie">${esc(state.olympName)} gewinnt</button><button class="btn ghost" id="drawTie">Niemand richtig · Unentschieden</button></div>`:`<p>Antwort zuerst mündlich geben. Danach gemeinsam aufdecken.</p><button class="btn primary" id="revealTie">Antwort anzeigen</button>`}</section>`;
 if(state.tieRevealed){$('#teamTie').onclick=()=>finishGame('team');$('#olympTie').onclick=()=>finishGame('olymp');$('#drawTie').onclick=()=>finishGame('draw');}
 else $('#revealTie').onclick=()=>{state.tieRevealed=true;render();};
}
function finishGame(side){stopTimer();state.winner=side;state.view='winner';render()}
function confetti(){const cols=['#5aa2ff','#8e6cff','#ffc35a','#fff','#47df9a'];let h='<div class="confetti">';for(let i=0;i<55;i++)h+=`<i style="left:${Math.random()*100}%;--d:${3.5+Math.random()*4}s;--delay:${-Math.random()*6}s;--x:${-100+Math.random()*200}px;--c:${cols[i%cols.length]}"></i>`;return h+'</div>'}
function renderWinner(){const win=state.winner==='team'?state.teamName:state.olympName;screen.innerHTML=`${confetti()}<section class="winner"><div class="eyebrow">Quizduell Olymp · Schulmodus</div><div class="winner-big">${state.winner==='draw'?'Unentschieden':'Sieg für<br><em>'+esc(win)+'</em>'}</div><p class="screen-sub">Hauptrunde ${state.teamScore} : ${state.olympScore} · Finale ${state.final.correct.team} : ${state.final.correct.olymp}</p><div class="btnrow" style="justify-content:center"><button class="btn orange" id="againBtn">Neue Partie</button><button class="btn ghost" id="setupBtn">Zurück zum Start</button></div></section>`;chime(true);$('#againBtn').addEventListener('click',()=>{const t=state.teamName,o=state.olympName;resetState();state.teamName=t;state.olympName=o;state.round=0;state.teamScore=0;state.olympScore=0;state.usedCategories=[];state.history=[];offerCategories()});$('#setupBtn').addEventListener('click',()=>{resetState();render()})}

function globalKey(e){if(e.repeat)return;if(e.target.matches('input,textarea,select')||e.target.isContentEditable)return;if($('#secretDialog').open){if(/^[1-4]$/.test(e.key)){e.preventDefault();olympSecret(+e.key-1);}return;}const k=e.key.toLowerCase();if(k==='h'){e.preventDefault();$('#shortcuts').classList.toggle('hidden');return}if(k==='v'){e.preventDefault();toggleFull();return}if(['1','2','3','4'].includes(k)){const i=+k-1;if(state.view==='question'&&state.phase==='olymp'){olympSecret(i)}else if(state.view==='question'&&state.phase==='team'){selectTeam(i)}return}if(e.key==='Enter'&&!e.target.closest('button')){e.preventDefault();if(state.view==='question'&&state.phase==='team'&&state.teamAnswer!==null)lockTeam();else if(state.view==='question'&&state.phase==='reveal')nextQuestion();else if(state.view==='finalGame'&&state.final.stage==='ready')startFinalQuestion();return}if(state.view==='finalGame'&&state.final.stage==='judging'&&k==='r')judgeFinal(true);if(state.view==='finalGame'&&state.final.stage==='judging'&&k==='f')judgeFinal(false)}
document.addEventListener('keydown',globalKey);
function toggleFull(){const el=document.documentElement;if(!document.fullscreenElement){el.requestFullscreen?.().catch(()=>{})}else document.exitFullscreen?.().catch(()=>{})}
$('#fullBtn').addEventListener('click',toggleFull);$('#hintBtn').addEventListener('click',()=>$('#shortcuts').classList.toggle('hidden'));$('#soundBtn').addEventListener('click',()=>{soundOn=!soundOn;$('#soundBtn').textContent=soundOn?'♪':'×';toast(soundOn?'Ton an':'Ton aus')});

$('#secretClose').onclick=()=>$('#secretDialog').close();
$('#secretDialog').querySelectorAll('[data-secret]').forEach(b=>b.onclick=()=>olympSecret(+b.dataset.secret));
if(!document.documentElement.requestFullscreen)$('#fullBtn').hidden=true;
makeFloaters();resetState();render();
})();
</script>
</body></html>
